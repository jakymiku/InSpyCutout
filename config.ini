[inspy]
# Model mode: base / fast / base-nightly
mode=base
# auto = CUDA if available, then MPS, otherwise CPU
device=auto
# static is the transparent-background default and is more stable
resize=static
torchscript=0

[defaults]
alpha_gamma=0.72
mask_offset=0
mask_blur=0.0
black_threshold=0
white_threshold=250

[ui]
# auto = Japanese on a Japanese OS, English otherwise. You can switch in the GUI.
language=auto
# Transparency preview refresh interval while painting (milliseconds)
paint_preview_ms=90
# 1 = keep Mask and Transparency Preview zoom/pan linked
sync_mask_preview=1

[paint]
mode=move
brush_color=white
brush_size=32

[editor]
# auto / paintnet_store / paintnet_desktop / windows_open_with / custom_exe
# auto: Paint.NET Desktop -> Paint.NET Store -> Windows Open with...
mode=auto
paintnet_aumid=dotPDNLLC.paint.net_h55e3w7q8jbva!dotPDNLLC.paint.net
paintnet_desktop_path=
mask_editor=
