name: Package Windows ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python for validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build and syntax-check release source
        shell: pwsh
        run: |
          $parts = Get-ChildItem "src/InSpyCutout.part*.py.txt" | Sort-Object Name
          if (-not $parts) { throw "InSpyCutout source parts are missing." }
          $source = ($parts | ForEach-Object { Get-Content -Raw -Encoding UTF8 $_.FullName }) -join ""
          [System.IO.File]::WriteAllText("InSpyCutout.release.py", $source, [System.Text.UTF8Encoding]::new($false))
          $env:PYTHONDONTWRITEBYTECODE = "1"
          python -m py_compile InSpyCutout.release.py tools/preload_model.py
          Get-ChildItem -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Recurse -File -Include *.pyc,*.pyo | Remove-Item -Force -ErrorAction SilentlyContinue

      - name: Build ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'dev' }
          $stage = Join-Path $env:RUNNER_TEMP "InSpyCutout-$version"
          New-Item -ItemType Directory -Force $stage | Out-Null
          $items = @(
            'Launch_GUI.bat','Setup.bat','setup.ps1','config.ini',
            'requirements.txt','README.md','README_ja.md','LICENSE','THIRD_PARTY_NOTICES.md',
            'CHANGELOG.md','tools'
          )
          foreach ($item in $items) { Copy-Item $item $stage -Recurse -Force }
          Copy-Item "InSpyCutout.release.py" (Join-Path $stage "InSpyCutout.py") -Force
          Get-ChildItem $stage -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem $stage -Recurse -File -Include *.pyc,*.pyo | Remove-Item -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path $stage -DestinationPath "dist/InSpyCutout-$version-Windows.zip" -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: InSpyCutout-Windows
          path: dist/*.zip

      - name: Publish GitHub Release asset
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME dist/*.zip --generate-notes --title $env:GITHUB_REF_NAME
